name: Refresh Argus Events

on:
  # Daily at 12:00 UTC. GDELT + UCDP are backward-looking — a fresh pull once
  # a day is enough for the dashboard to feel current. Anthropic spend scales
  # linearly with this cadence, so anything more frequent burns money for no
  # analyst value. Trigger manually via workflow_dispatch before a live demo.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/refresh-events.js
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UCDP_API_TOKEN: ${{ secrets.UCDP_API_TOKEN }}
